name: Mise à jour des données
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: "Europe/Paris"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: maj-donnees
  cancel-in-progress: false
jobs:
  rafraichir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 fetch_stations.py --refresh
      - run: python3 build_map.py
      - run: python3 export_json.py
      - run: |
          mkdir -p site
          cp data/carte.html site/index.html
          cp data/carte.html site/carte.html
          cp data/stations_france.csv data/stations_france.json data/meta.json site/
      - run: python3 resume.py
      # GitHub désactive une tâche planifiée après 60 jours sans activité du
      # dépôt : on republie donc un petit fichier d'état de temps en temps.
      - name: Maintenir l'activité du dépôt
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Dernier commit il y a $age jour(s)"
          if [ "$age" -gt 45 ]; then
            cp data/meta.json etat.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add etat.json
            git commit -m "Point d'etape des donnees (maintien de l'activite du depot)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publication
        uses: actions/deploy-pages@v4
