name: Mise à jour des données
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: maj-donnees
  cancel-in-progress: false
jobs:
  rafraichir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 fetch_stations.py --refresh
      - run: python3 build_map.py
      - run: python3 export_json.py
      - run: |
          mkdir -p site
          cp data/carte.html site/index.html
          cp data/carte.html site/carte.html
          cp data/stations_france.csv data/stations_france.json data/meta.json site/
      - run: python3 resume.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publication
        uses: actions/deploy-pages@v4
